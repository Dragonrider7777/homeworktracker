<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Homework Tracker</title>
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <div class="container">
      <div id="page-header">
        <h1>Homework Assignment Tracker</h1>
        <p class="subtitle">
          Track what is due, what is urgent, and what is finished.
        </p>
      </div>

      <div id="filters">
        <button class="filter-btn" data-filter="all" onclick="setFilter('all')">
          All
        </button>
        <button
          class="filter-btn"
          data-filter="active"
          onclick="setFilter('active')"
        >
          Active
        </button>
        <button
          class="filter-btn"
          data-filter="overdue"
          onclick="setFilter('overdue')"
        >
          Overdue
        </button>
        <button
          class="filter-btn"
          data-filter="due-soon"
          onclick="setFilter('due-soon')"
        >
          Due Soon
        </button>
        <button
          class="filter-btn"
          data-filter="completed"
          onclick="setFilter('completed')"
        >
          Completed
        </button>
      </div>

      <div id="list-summary"></div>
      <ul id="list"></ul>

      <div id="add-assignment">
        <div class="section-header">
          <h2>Add Assignment</h2>
          <p>Create a new task with an optional due date and source.</p>
        </div>

        <label for="title">Title</label>
        <input id="title" placeholder="Essay draft" />

        <label for="course">Course</label>
        <input id="course" placeholder="English" />

        <label for="dueDate">Due Date</label>
        <div class="date-picker">
          <input
            id="dueDate"
            type="text"
            placeholder="Select a date"
            readonly
          />
          <button type="button" id="date-picker-btn">
            <i class="fa-solid fa-calendar-days"></i>
          </button>

          <div id="calendar-popup" class="calendar-popup hidden"></div>
        </div>

        <label for="source">Source</label>
        <input id="source" placeholder="Google Classroom" />

        <div class="form-actions">
          <button id="submit-btn" class="primary-btn" onclick="add()">
            Add
          </button>
        </div>
      </div>
    </div>
    <div id="toast-container"></div>
    <script src="js/calendar.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
